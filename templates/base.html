<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portal de Servicios{% endblock %}</title>
    <!-- Bootstrap 4.6 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Estilos Personalizados -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>
    <div class="container main-container">
        <!-- Encabezado del Portal -->
        <div class="header-title">
            <i class="bi bi-window-sidebar"></i>
            <span>Portal de Servicios</span>
        </div>

        <!-- Menú Navegación Unificado -->
        <nav class="nav nav-pills custom-nav">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="{{ url_for('inicio') }}">Inicio</a>
            <a class="nav-link {% if request.path == '/compra' %}active{% endif %}" href="{{ url_for('compra') }}">Compra</a>
            <a class="nav-link {% if request.path == '/salario' %}active{% endif %}" href="{{ url_for('salario') }}">Salario</a>
            <a class="nav-link {% if request.path == '/temperatura' %}active{% endif %}" href="{{ url_for('temperatura') }}">Temperatura</a>
            <a class="nav-link {% if request.path == '/empresa' %}active{% endif %}" href="{{ url_for('empresa') }}">Empresa</a>
            <a class="nav-link {% if request.path == '/servicios' %}active{% endif %}" href="{{ url_for('servicios') }}">Servicios</a>
            <a class="nav-link {% if request.path == '/contacto' %}active{% endif %}" href="{{ url_for('contacto') }}">Contacto</a>
        </nav>

        <!-- Contenido Dinámico de las Páginas -->
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Scripts requeridos para Bootstrap 4.6 (jQuery, Popper.js y Bootstrap JS) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
</body>
</html>
